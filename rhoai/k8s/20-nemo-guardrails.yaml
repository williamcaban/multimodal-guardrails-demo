# NeMo Guardrails served by the RHOAI TrustyAI operator. One instance hosts four configurations;
# clients pick one with {"guardrails": {"config_id": "<name>"}} (nested, a top-level config_id is
# silently ignored). The ConfigMaps mmg-<name> are generated by rhoai/render_configs.py.
#
# enable-auth makes the service require a bearer token of an identity with the `view` role in this
# namespace (see 30-ui.yaml, ServiceAccount mm-ui).
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: mm-guardrails
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/part-of: mm-guardrails-demo
  annotations:
    security.opendatahub.io/enable-auth: "true"
spec:
  nemoConfigs:
    # Fail safe: a request without a config_id gets both rails, never the unprotected config.
    - name: pii-and-injection
      configMaps: [mmg-pii-and-injection]
      default: true
    - name: pii-vision
      configMaps: [mmg-pii-vision]
    - name: injection-vision
      configMaps: [mmg-injection-vision]
    # No rails: the "unprotected" side of the comparison in the UI.
    - name: no-rails
      configMaps: [mmg-no-rails]
  env:
    - name: MODEL_API_KEY
      valueFrom:
        secretKeyRef:
          name: qwen3-vl-8b-maas-key
          key: api-key
