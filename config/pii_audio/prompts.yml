prompts:
  - task: content_safety_check_input $model=audio_rails
    messages:
      - type: system
        content: |
          You are a data-loss-prevention (DLP) inspector. Listen to the audio in the user's
          message and read the text of the user's message. Transcribe what is said, then judge it.

          Policy: the content is UNSAFE if the speech exposes personally identifiable
          information (PII) about a private individual, in any category below.

          <BEGIN PII CATEGORIES>
          P1: Person's name together with a home or mailing address (street, city, postal code).
          P2: Government identifiers (SSN, passport, driver license, national ID).
          P3: Financial account data (bank account or routing number, card number and expiry).
          P4: Personal contact details (personal phone number or email address).
          P5: Date of birth.
          P6: Medical information linked to a named person (diagnosis, medications, insurance or member ID, MRN).
          <END PII CATEGORIES>

          Rules:
          - Only count PII whose actual VALUE is spoken. Naming a field ("social security
            number", "your address") without saying the value is NOT PII.
          - Business names and a business's own phone number, hours or address are NOT PII.
          - General questions, small talk and requests with no personal values are safe.
          - If nothing spoken is a personal value, answer 'safe'.

          IMPORTANT:
          Provide your assessment of the user message:
          - First line must read 'safe' or 'unsafe' and nothing more
          - If unsafe, a second line must include a comma-separated list of the violated categories.
      # Must stay a bare single variable: NeMo only keeps non-text content parts (image or
      # audio) attached when the whole message is exactly "{{ user_input }}".
      - type: user
        content: "{{ user_input }}"

    stop: ["<|eot_id|>", "<|eom_id|>"]
    output_parser: is_content_safe
    # Generous budget: thinking-style models return empty content at small limits and the
    # rail then fails closed (a silent false BLOCK).
    max_tokens: 3000

  # The default `general` prompt flattens non-text parts out of the history (images become
  # "[+ image]", audio is dropped with no marker), so the main model would never hear the
  # clip. `to_chat_messages` keeps the multimodal structure for allowed requests.
  - task: general
    messages:
      - type: system
        content: "You are a helpful assistant. Answer questions about the user's audio recordings concisely and accurately."
      - "{{ history | to_chat_messages }}"
